<!-- JAVASCRIPT LOGIC -->
    <script>
        // Initial Mock Data
        const INITIAL_DATA = [
            {
                id: '1',
                type: 'room',
                borrower: 'ครูสมศักดิ์ รักเรียน',
                dept: 'กลุ่มสาระฯ วิทยาศาสตร์',
                title: 'การอบรมเชิงปฏิบัติการหัตถการวิทยาศาสตร์ ม.ปลาย',
                roomName: 'หอประชุมราชพฤกษ์ ',
                attendees: 45,
                date: '2026-10-30',
                startTime: '09:00',
                endTime: '12:00',
                status: 'approved',
                createdAt: new Date().toISOString()
            },
            {
                id: '2',
                type: 'room',
                borrower: 'นร.อนันต์ สุขใจ (ประธานสภา)',
                dept: 'สภานักเรียน',
                title: 'การประชุมเตรียมงานกีฬาประจำปี',
                roomName: 'ห้องมหาชนก ',
                attendees: 25,
                date: '2026-10-30',
                startTime: '13:00',
                endTime: '15:30',
                status: 'approved',
                createdAt: new Date().toISOString()
            },
            {
                id: '3',
                type: 'equipment',
                borrower: 'ครูวิภาดา สอนดี',
                dept: 'กลุ่มสาระฯ ภาษาต่างประเทศ',
                title: 'กิจกรรม English Singing Contest',
                equipItem: 'ชุดไมโครโฟนไร้สาย (2 ตัว) + ลำโพงเคลื่อนที่ 100W',
                qty: 2,
                startDateTime: '2026-10-31T08:30',
                endDateTime: '2026-10-31T12:00',
                status: 'approved',
                createdAt: new Date().toISOString()
            }
        ];

        // Global State Variables
        let appData = [];
        let isAdminLoggedIn = false;
        let activeAdminSubTab = 'pending';
        let statsData = {
            teamCount: 20,
            equipReady: '95%'
        };

        // Web App URL จาก Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzhP2ta-Z_0pGO0g5hG9dB5ZeGb5qXSVmNNBC7yQD6uHpdYimsyhMPNBZ42OLfvuzMBLg/exec";

        // Initial Load (ดึงข้อมูลออนไลน์จาก Google Sheets)
        window.onload = async function() {
            try {
                let response = await fetch(WEB_APP_URL);
                let result = await response.json();
                
                appData = result.map(row => ({
                    id: row.id || Date.now().toString(),
                    type: row.type || (row.roomName ? 'room' : 'equipment'),
                    roomName: row.roomName || '',
                    equipItem: row.equipItem || '',
                    borrower: row.borrower || '',
                    dept: row.dept || '',
                    title: row.title || '',
                    date: row.date || '',
                    startTime: row.startTime || '',
                    endTime: row.endTime || '',
                    attendees: parseInt(row.attendees) || 0,
                    qty: parseInt(row.qty) || 1,
                    startDateTime: row.startDateTime || '',
                    endDateTime: row.endDateTime || '',
                    status: row.status || 'pending'
                }));
            } catch (error) {
                console.error("ไม่สามารถโหลดข้อมูลจาก Google Sheets ได้:", error);
                appData = [...INITIAL_DATA];
            }

            const savedAuth = localStorage.getItem('school_av_admin_logged');
            if (savedAuth === 'true') {
                isAdminLoggedIn = true;
            }

            updateAuthUI();
            renderStatsDisplay();
            renderRoomTable();
            if (typeof renderEquipTable === 'function') renderEquipTable();
            if (typeof renderAdminPortal === 'function') renderAdminPortal();
        };

        // ฟังก์ชันบันทึกข้อมูลส่งตรงไปยัง Google Sheets แบบเสถียร (ไม่ค้าง)
        async function saveToLocalStorage() {
            const latestBooking = appData[appData.length - 1];
            if (!latestBooking) return;

            const bookingData = {
                type: latestBooking.type || "room",
                roomName: latestBooking.roomName || "",
                equipItem: latestBooking.equipItem || "",
                borrower: latestBooking.borrower || "",
                dept: latestBooking.dept || "",
                title: latestBooking.title || "",
                date: latestBooking.date || "",
                startTime: latestBooking.startTime || "",
                endTime: latestBooking.endTime || "",
                attendees: latestBooking.attendees || 0,
                qty: latestBooking.qty || 1,
                startDateTime: latestBooking.startDateTime || "",
                endDateTime: latestBooking.endDateTime || "",
                status: latestBooking.status || "pending"
            };

            try {
                showToast('กำลังบันทึกข้อมูลลงระบบ...', 'info');

                await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(bookingData)
                });
                
                showToast('บันทึกข้อมูลสำเร็จ! กำลังรีเฟรช...', 'success');

                // รีเฟรชหน้าเว็บอัตโนมัติหลังจากบันทึกเสร็จ 1 วินาที เพื่อดึงข้อมูลล่าสุดจาก Google Sheets มาแสดงอย่างไร้รอยต่อ
                setTimeout(() => {
                    window.location.reload();
                }, 1000);

            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการบันทึกข้อมูล:", error);
                showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
            }
        }

        function renderStatsDisplay() {
            document.getElementById('dash-team-count-display').textContent = statsData.teamCount + ' คน';
            document.getElementById('dash-equip-ready-display').textContent = statsData.equipReady;

            const inputTeam = document.getElementById('input-team-count');
            const inputReady = document.getElementById('input-equip-ready');
            if (inputTeam) inputTeam.value = statsData.teamCount;
            if (inputReady) inputReady.value = statsData.equipReady;

            const today = new Date().toISOString().split('T')[0];
            const todayJobs = appData.filter(i => {
                if (i.type === 'room') return i.date === today && i.status === 'approved';
                if (i.type === 'equipment') return i.startDateTime && i.startDateTime.startsWith(today) && i.status === 'approved';
                return false;
            }).length;
            document.getElementById('dash-today-jobs-display').textContent = todayJobs + ' งาน';
        }

        function updateDashboardStats() {
            const team = parseInt(document.getElementById('input-team-count').value) || 0;
            const ready = document.getElementById('input-equip-ready').value.trim() || '100%';

            statsData.teamCount = team;
            statsData.equipReady = ready;

            localStorage.setItem('school_av_stats', JSON.stringify(statsData));
            renderStatsDisplay();
            showToast('อัปเดตสถิติเรียบร้อยแล้ว', 'success');
        }

        function switchTab(tabName) {
            const tabs = ['room-schedule', 'equipment-schedule', 'admin-portal'];
            
            tabs.forEach(t => {
                const section = document.getElementById(`section-${t}`);
                const tabBtn = document.getElementById(`tab-${t}`);
                
                if (section) {
                    if (t === tabName) {
                        section.classList.remove('hidden');
                    } else {
                        section.classList.add('hidden');
                    }
                }
                
                if (tabBtn) {
                    if (t === tabName) {
                        tabBtn.classList.add('tab-active');
                    } else {
                        tabBtn.classList.remove('tab-active');
                    }
                }
            });

            if (tabName === 'room-schedule') renderRoomTable();
            if (tabName === 'equipment-schedule') renderEquipTable();
            if (tabName === 'admin-portal') renderAdminPortal();
        }

        function renderRoomTable() {
            const tbody = document.getElementById('room-table-body');
            const filterDate = document.getElementById('room-filter-date').value;
            const filterRoom = document.getElementById('room-filter-select').value;
            const emptyMsg = document.getElementById('room-empty-msg');

            let list = appData.filter(item => item.type === 'room');

            if (filterDate) {
                list = list.filter(item => item.date === filterDate);
            }
            if (filterRoom !== 'all') {
                list = list.filter(item => item.roomName === filterRoom);
            }

            tbody.innerHTML = '';

            if (list.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            list.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-amber-50/30 transition border-b border-slate-100";
                
                const statusBadge = getStatusBadgeHTML(item.status);

                tr.innerHTML = `
                    <td class="py-4 px-6 whitespace-nowrap">
                        <div class="font-semibold text-slate-800"><i class="fa-regular fa-calendar text-amber-600 mr-1.5"></i>${formatThaiDate(item.date)}</div>
                        <div class="text-xs text-slate-500 mt-0.5"><i class="fa-regular fa-clock mr-1"></i>${item.startTime} - ${item.endTime} น.</div>
                    </td>
                    <td class="py-4 px-6 font-medium text-amber-800">
                        ${item.roomName}
                    </td>
                    <td class="py-4 px-6 max-w-xs">
                        <div class="font-medium text-slate-800 truncate" title="${item.title}">${item.title}</div>
                    </td>
                    <td class="py-4 px-6">
                        <div class="text-slate-800 font-medium">${item.borrower}</div>
                        <div class="text-xs text-slate-500">${item.dept}</div>
                    </td>
                    <td class="py-4 px-6 text-center font-semibold text-slate-700">
                        ${item.attendees} คน
                    </td>
                    <td class="py-4 px-6 text-center">
                        ${statusBadge}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function resetRoomFilter() {
            document.getElementById('room-filter-date').value = '';
            document.getElementById('room-filter-select').value = 'all';
            renderRoomTable();
        }

        function renderEquipTable() {
            const tbody = document.getElementById('equip-table-body');
            const filterDate = document.getElementById('equip-filter-date').value;
            const filterSearch = document.getElementById('equip-filter-search').value.toLowerCase().trim();
            const emptyMsg = document.getElementById('equip-empty-msg');

            let list = appData.filter(item => item.type === 'equipment');

            if (filterDate) {
                list = list.filter(item => item.startDateTime && item.startDateTime.startsWith(filterDate));
            }

            if (filterSearch) {
                list = list.filter(item => 
                    (item.equipItem && item.equipItem.toLowerCase().includes(filterSearch)) ||
                    (item.borrower && item.borrower.toLowerCase().includes(filterSearch)) ||
                    (item.title && item.title.toLowerCase().includes(filterSearch))
                );
            }

            tbody.innerHTML = '';

            if (list.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            list.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-amber-50/30 transition border-b border-slate-100";
                
                const statusBadge = getStatusBadgeHTML(item.status);

                tr.innerHTML = `
                    <td class="py-4 px-6 whitespace-nowrap">
                        <div class="font-medium text-slate-800"><i class="fa-regular fa-calendar-check text-amber-600 mr-1.5"></i>${formatThaiDateTime(item.startDateTime)}</div>
                    </td>
                    <td class="py-4 px-6 font-medium text-slate-800 max-w-xs">
                        <span class="text-amber-800 font-semibold">${item.equipItem}</span>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <span class="bg-amber-100 text-amber-900 px-2.5 py-1 rounded-lg text-xs font-bold">${item.qty}</span>
                    </td>
                    <td class="py-4 px-6">
                        <div class="font-medium text-slate-800">${item.borrower}</div>
                        <div class="text-xs text-slate-500">${item.title} (${item.dept})</div>
                    </td>
                    <td class="py-4 px-6 text-center text-xs text-slate-600 whitespace-nowrap">
                        ${formatThaiDateTime(item.endDateTime)}
                    </td>
                    <td class="py-4 px-6 text-center">
                        ${statusBadge}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function resetEquipFilter() {
            document.getElementById('equip-filter-date').value = '';
            document.getElementById('equip-filter-search').value = '';
            renderEquipTable();
        }

        function openAuthModal() {
            if (isAdminLoggedIn) {
                isAdminLoggedIn = false;
                localStorage.setItem('school_av_admin_logged', 'false');
                updateAuthUI();
                showToast('ออกจากระบบเจ้าหน้าที่เรียบร้อยแล้ว', 'info');
                renderAdminPortal();
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
                document.getElementById('auth-pass-input').value = '';
                document.getElementById('auth-pass-input').focus();
            }
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('auth-pass-input').value;
            
            if (pass === 'sodnava') {
                isAdminLoggedIn = true;
                localStorage.setItem('school_av_admin_logged', 'true');
                closeAuthModal();
                updateAuthUI();
                showToast('เข้าสู่ระบบสำเร็จ! สวัสดีฝ่ายงานโสตฯ', 'success');
                switchTab('admin-portal');
            } else {
                showToast('รหัสผ่านไม่ถูกต้อง! ', 'error');
            }
        }

        function updateAuthUI() {
            const btnText = document.getElementById('auth-btn-text');
            const authBtn = document.getElementById('auth-btn');
            const badge = document.getElementById('user-status-badge');

            if (authBtn) {
                if (isAdminLoggedIn) {
                    if (btnText) btnText.textContent = 'ออกจากระบบ';
                    authBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
                    authBtn.classList.add('bg-slate-700', 'hover:bg-slate-800');
                } else {
                    if (btnText) btnText.textContent = 'เข้าสู่ระบบ (ฝ่ายโสตฯ)';
                    authBtn.classList.remove('bg-slate-700', 'hover:bg-slate-800');
                    authBtn.classList.add('bg-amber-500', 'hover:bg-amber-600');
                }
            }

            if (badge) {
                if (isAdminLoggedIn) badge.classList.remove('hidden');
                else badge.classList.add('hidden');
            }

            updatePendingBadge();
        }

        function updatePendingBadge() {
            const pendingCount = appData.filter(i => i.status === 'pending').length;
            const badge = document.getElementById('pending-count-badge');

            if (badge) {
                if (pendingCount > 0) {
                    badge.textContent = pendingCount;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        function renderAdminPortal() {
            const guard = document.getElementById('admin-login-guard');
            const content = document.getElementById('admin-content');

            if (!isAdminLoggedIn) {
                guard.classList.remove('hidden');
                content.classList.add('hidden');
                return;
            }

            guard.classList.add('hidden');
            content.classList.remove('hidden');

            const pendingList = appData.filter(i => i.status === 'pending');
            const roomList = appData.filter(i => i.type === 'room');
            const equipList = appData.filter(i => i.type === 'equipment');

            document.getElementById('dash-pending-count').textContent = pendingList.length;
            document.getElementById('dash-room-count').textContent = roomList.length;
            document.getElementById('dash-equip-count').textContent = equipList.length;

            renderAdminSubTabContent();
        }

        function setAdminSubTab(subTab) {
            activeAdminSubTab = subTab;
            
            ['pending', 'room', 'equip'].forEach(t => {
                const btn = document.getElementById(`subtab-${t}`);
                const section = document.getElementById(`admin-subtab-${t}`);

                if (t === subTab) {
                    btn.className = "px-4 py-2 rounded-xl text-sm font-medium bg-amber-100 text-amber-900 border border-amber-200";
                    section.classList.remove('hidden');
                } else {
                    btn.className = "px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 border border-transparent";
                    section.classList.add('hidden');
                }
            });

            renderAdminSubTabContent();
        }

        function renderAdminSubTabContent() {
            if (activeAdminSubTab === 'pending') {
                const container = document.getElementById('pending-list-container');
                const pendingItems = appData.filter(i => i.status === 'pending');

                container.innerHTML = '';
                if (pendingItems.length === 0) {
                    container.innerHTML = `<div class="p-8 text-center text-slate-400 bg-slate-50 rounded-xl">ไม่มีคำขอยืมที่รออนุมัติในขณะนี้</div>`;
                    return;
                }

                pendingItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "p-4 border border-slate-200 rounded-xl bg-slate-50/50 flex flex-col md:flex-row md:items-center justify-between gap-4";

                    let detailText = item.type === 'room' 
                        ? `<i class="fa-solid fa-door-open text-amber-600 mr-1"></i> <strong>${item.roomName}</strong> (${formatThaiDate(item.date)} ${item.startTime}-${item.endTime} น. | ผู้เข้าร่วม ${item.attendees} คน)`
                        : `<i class="fa-solid fa-microphone text-amber-600 mr-1"></i> <strong>${item.equipItem}</strong> (จำนวน ${item.qty} ชิ้น | ยืม: ${formatThaiDateTime(item.startDateTime)})`;

                    card.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded font-medium">รอการตรวจสอบ</span>
                                <span class="text-xs text-slate-400">${formatThaiDateTime(item.createdAt)}</span>
                            </div>
                            <h4 class="font-bold text-slate-800 text-base">${item.title}</h4>
                            <p class="text-sm text-slate-600">${detailText}</p>
                            <p class="text-xs text-slate-500">ผู้ขอยืม: <span class="font-medium text-slate-700">${item.borrower}</span> (${item.dept})</p>
                        </div>
                        <div class="flex items-center gap-2 self-end md:self-center">
                            <button onclick="changeStatus('${item.id}', 'rejected')" class="px-3 py-1.5 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50 text-xs font-medium transition">
                                <i class="fa-solid fa-xmark"></i> ปฏิเสธ
                            </button>
                            <button onclick="changeStatus('${item.id}', 'approved')" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium transition shadow-sm">
                                <i class="fa-solid fa-check"></i> อนุมัติคำขอ
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else if (activeAdminSubTab === 'room') {
                const tbody = document.getElementById('admin-room-tbody');
                const rooms = appData.filter(i => i.type === 'room');
                tbody.innerHTML = '';

                rooms.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 border-b border-slate-100";
                    tr.innerHTML = `
                        <td class="py-3 px-4 whitespace-nowrap text-xs">
                            <div class="font-medium text-slate-800">${item.date}</div>
                            <div class="text-slate-400">${item.startTime} - ${item.endTime}</div>
                        </td>
                        <td class="py-3 px-4 font-medium text-amber-800">${item.roomName}</td>
                        <td class="py-3 px-4 font-medium text-slate-800">${item.title}</td>
                        <td class="py-3 px-4 text-xs">${item.borrower}</td>
                        <td class="py-3 px-4 text-center">${getStatusBadgeHTML(item.status)}</td>
                        <td class="py-3 px-4 text-center space-x-1 whitespace-nowrap">
                            <button onclick="openEditModal('${item.id}')" class="p-1.5 text-slate-500 hover:text-amber-600"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteRecord('${item.id}')" class="p-1.5 text-slate-500 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } else if (activeAdminSubTab === 'equip') {
                const tbody = document.getElementById('admin-equip-tbody');
                const equips = appData.filter(i => i.type === 'equipment');
                tbody.innerHTML = '';

                equips.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 border-b border-slate-100";
                    tr.innerHTML = `
                        <td class="py-3 px-4 whitespace-nowrap text-xs">
                            <div>${item.startDateTime ? item.startDateTime.replace('T', ' ') : '-'}</div>
                        </td>
                        <td class="py-3 px-4 font-medium text-slate-800">${item.equipItem}</td>
                        <td class="py-3 px-4 text-center font-bold text-xs">${item.qty}</td>
                        <td class="py-3 px-4 text-xs">${item.borrower}</td>
                        <td class="py-3 px-4 text-center">${getStatusBadgeHTML(item.status)}</td>
                        <td class="py-3 px-4 text-center space-x-1 whitespace-nowrap">
                            <button onclick="openEditModal('${item.id}')" class="p-1.5 text-slate-500 hover:text-amber-600"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteRecord('${item.id}')" class="p-1.5 text-slate-500 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function changeStatus(id, newStatus) {
            const targetId = String(id);
            const index = appData.findIndex(i => String(i.id) === targetId);
            if (index !== -1) {
                appData[index].status = newStatus;
                saveToLocalStorage();
                showToast(`อัปเดตสถานะเป็น "${getStatusText(newStatus)}" แล้ว`, 'success');
                renderAdminPortal();
                renderStatsDisplay();
                renderRoomTable();
                renderEquipTable();
                updatePendingBadge();
            }
        }

        function deleteRecord(id) {
            if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
                const targetId = String(id);
                appData = appData.filter(i => String(i.id) !== targetId);
                
                saveToLocalStorage();
                showToast('ลบรายการเรียบร้อยแล้ว', 'info');
                
                renderAdminPortal();
                renderStatsDisplay();
                renderRoomTable();
                renderEquipTable();
                updatePendingBadge();
            }
        }

        function openCreateModal() {
            document.getElementById('modal-title').textContent = 'เพิ่มรายการยืมใหม่ (โดยฝ่ายโสตฯ)';
            document.getElementById('edit-id').value = '';
            document.getElementById('modal-form').reset();
            toggleModalFields();
            document.getElementById('record-modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const targetId = String(id);
            const item = appData.find(i => String(i.id) === targetId);
            if (!item) return;

            document.getElementById('modal-title').textContent = 'แก้ไขรายการยืม';
            document.getElementById('edit-id').value = item.id;
            document.getElementById('modal-type').value = item.type;
            document.getElementById('modal-borrower').value = item.borrower || '';
            document.getElementById('modal-dept').value = item.dept || '';
            document.getElementById('modal-title-input').value = item.title || '';
            document.getElementById('modal-status').value = item.status || 'approved';

            toggleModalFields();

            if (item.type === 'room') {
                document.getElementById('modal-room-name').value = item.roomName || '';
                document.getElementById('modal-attendees').value = item.attendees || 30;
                document.getElementById('modal-room-date').value = item.date || '';
                document.getElementById('modal-room-start').value = item.startTime || '';
                document.getElementById('modal-room-end').value = item.endTime || '';
            } else {
                document.getElementById('modal-equip-item').value = item.equipItem || '';
                document.getElementById('modal-equip-qty').value = item.qty || 1;
                document.getElementById('modal-equip-start').value = item.startDateTime || '';
                document.getElementById('modal-equip-end').value = item.endDateTime || '';
            }

            document.getElementById('record-modal').classList.remove('hidden');
        }

        function closeRecordModal() {
            document.getElementById('record-modal').classList.add('hidden');
        }

        function toggleModalFields() {
            const type = document.getElementById('modal-type').value;
            const roomBox = document.getElementById('modal-room-box');
            const equipBox = document.getElementById('modal-equip-box');

            if (type === 'room') {
                roomBox.classList.remove('hidden');
                equipBox.classList.add('hidden');
            } else {
                roomBox.classList.add('hidden');
                equipBox.classList.remove('hidden');
            }
        }

        function handleSaveRecord(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const type = document.getElementById('modal-type').value;

            const record = {
                id: editId || 'ID_' + Date.now(),
                type: type,
                borrower: document.getElementById('modal-borrower').value,
                dept: document.getElementById('modal-dept').value,
                title: document.getElementById('modal-title-input').value,
                status: document.getElementById('modal-status').value,
                createdAt: new Date().toISOString()
            };

            if (type === 'room') {
                record.roomName = document.getElementById('modal-room-name').value;
                record.attendees = parseInt(document.getElementById('modal-attendees').value) || 1;
                record.date = document.getElementById('modal-room-date').value;
                record.startTime = document.getElementById('modal-room-start').value;
                record.endTime = document.getElementById('modal-room-end').value;
            } else {
                record.equipItem = document.getElementById('modal-equip-item').value;
                record.qty = parseInt(document.getElementById('modal-equip-qty').value) || 1;
                record.startDateTime = document.getElementById('modal-equip-start').value;
                record.endDateTime = document.getElementById('modal-equip-end').value;
            }

            if (editId) {
                const idx = appData.findIndex(i => String(i.id) === String(editId));
                if (idx !== -1) appData[idx] = record;
            } else {
                appData.unshift(record);
            }

            closeRecordModal();
            saveToLocalStorage();
            
            renderAdminPortal();
            renderStatsDisplay();
            renderRoomTable();
            renderEquipTable();
            updatePendingBadge();
        }

        function getStatusBadgeHTML(status) {
            switch(status) {
                case 'approved':
                    return `<span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-semibold border border-emerald-200"><i class="fa-solid fa-circle-check text-[10px]"></i> อนุมัติแล้ว</span>`;
                case 'pending':
                    return `<span class="inline-flex items-center gap-1 bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full text-xs font-semibold border border-amber-200"><i class="fa-solid fa-clock text-[10px]"></i> รออนุมัติ</span>`;
                case 'returned':
                    return `<span class="inline-flex items-center gap-1 bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full text-xs font-semibold border border-slate-200"><i class="fa-solid fa-rotate-left text-[10px]"></i> คืนแล้ว</span>`;
                case 'rejected':
                    return `<span class="inline-flex items-center gap-1 bg-rose-50 text-rose-700 px-2.5 py-1 rounded-full text-xs font-semibold border border-rose-200"><i class="fa-solid fa-circle-xmark text-[10px]"></i> ไม่อนุมัติ</span>`;
                default:
                    return `<span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full text-xs">ไม่ทราบ</span>`;
            }
        }

        function getStatusText(status) {
            if (status === 'approved') return 'อนุมัติแล้ว';
            if (status === 'pending') return 'รออนุมัติ';
            if (status === 'rejected') return 'ไม่อนุมัติ';
            if (status === 'returned') return 'คืนแล้ว';
            return status;
        }

        function formatThaiDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
        }

        function formatThaiDateTime(dateTimeStr) {
            if (!dateTimeStr) return '-';
            const parts = dateTimeStr.split('T');
            const datePart = formatThaiDate(parts[0]);
            const timePart = parts[1] ? `${parts[1]} น.` : '';
            return `${datePart} ${timePart}`;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-800 text-white';
            if (type === 'success') bgClass = 'bg-emerald-600 text-white';
            if (type === 'error') bgClass = 'bg-rose-600 text-white';

            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 transition-all duration-300 opacity-0 transform translate-y-2`;
            toast.innerHTML = `<span>${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
